name: usb_shell
version: "0.1.0"
required_abi_version: 1
# The shell only needs FS access — to read .dap ELFs from /flash/bin/ and
# /sd/bin/ via the loader, and to read/write /tmp/.duneos_stdout for the
# captured-app stdout redirect. Apps it launches declare their own perms;
# the shell's mask is NOT transitive.
#   FS_READ (32) + FS_WRITE (64) = 96
permissions: 96
# stack_size OVERRIDE (dbt auto-sizes everything else): the shell runs captured
# bin apps (ps, ls, cat, grep…) IN ITS OWN TASK (ADR 016) — plus the loader, plus
# a pipeline's run_pipeline→run_stage chain, plus the tool's frames, plus the
# VFS→sink→CDC write chain — all on THIS stack at once. `source` doubles that
# (the `source` command's chain + each script command's own). 8 KB blew up on a
# piped grep; 16 KB blew up on `source` of the self-test; 20 KB gives margin.
# (Root fix is the backlog "captured-bin stack guard".)
stack_size: 20480
