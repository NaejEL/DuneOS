name: battery_daemon
version: "0.1.0"
required_abi_version: 1
# I2C (8) + FS_READ (32) + FS_WRITE (64) + BATTERY (128) = 232
permissions: 232
capabilities:
  - battery
  - charger
# The charger half is guarded by #ifdef DUNEOS_CHARGER_DRIVER, so a board with
# a gauge and no charger chip must lose the charger code, not the whole app.
# Without this, resolve() raises for the missing section and builder.py skips
# the app entirely — a battery daemon that silently is not in the image.
optional_capabilities:
  - charger
sources:
  - $SDK/log/dlog.c
