name: wifi
version: "0.1.0"
required_abi_version: 1
icon: wifi
permissions: 352          # FS_READ | FS_WRITE | INPUT
# heap_size keeps the app in spawned mode: its own task, BSS in the app pool,
# and it can loop on the daemon's status files without holding the shell task.
heap_size: 8192
capabilities:
  - display
sources:
  - $SDK/input/libinput.c
  - $SDK/input/libinput_fd.c
  - $SDK/display/gfx.c
  - $SDK/ui/ui.c
  - $SDK/ui/ui_statusbar.c
  - $SDK/ui/ui_text_entry.c
  # The on-screen keyboard: this app asks for it by name because it is the one
  # that has to take a passphrase on a board with no physical keys. An app that
  # does not list these two links none of it.
  - $SDK/ui/ui_vkbd.c
  - $SDK/ui/ui_vkbd_draw.c
  - $SDK/net/known_yaml.c
