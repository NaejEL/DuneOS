name: splash
version: "0.1.0"
required_abi_version: 1
permissions: 0
stack_size: 8192
# STREAM mode — no back-buffer, draws go directly to /dev/disp0.
# Small heap is enough for libgfx + libdisp internal state (~600 B).
# heap_size > 0 keeps the app in spawned mode so init/the shell don't
# block while it runs its 1.5 s sequence.
heap_size: 4096
capabilities:
  - display
sources:
  - $SDK/display/gfx.c
