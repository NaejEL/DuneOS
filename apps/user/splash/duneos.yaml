name: splash
version: "0.1.0"
required_abi_version: 1
# FS_READ (32) to open /etc/splash/config.yaml and the configured .dr asset.
permissions: 32
stack_size: 8192
# STREAM mode (libgfx) + an optional logo image in app memory.
# A 120x120 RGB565 logo is 28.8 KiB; +4 KiB slack + libdisp state.
heap_size: 36864
icon: app
capabilities:
  - display
sources:
  - $SDK/display/gfx.c
  - $SDK/image/libimage.c
