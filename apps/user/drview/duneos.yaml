name: drview
version: "0.1.0"
required_abi_version: 1
icon: drview
opens: [".dr"]            # ADR 026 — image viewer for Dune Raster files
permissions: 288         # FS_READ | INPUT
heap_size: 8192
capabilities:
  - display
sources:
  - $SDK/display/gfx.c
  - $SDK/ui/ui.c
  - $SDK/ui/ui_carousel.c
  - $SDK/image/libimage.c
