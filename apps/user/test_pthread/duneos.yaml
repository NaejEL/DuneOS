name: test_pthread
version: "0.1.0"
required_abi_version: 3
# FS_WRITE (64) for printf → stdout. No other resources used.
permissions: 64
# heap_size omitted on purpose: when the user types `test_pthread` at the
# usb_shell prompt, the shell sees no heap_size and dispatches to CAPTURED
# mode → pthread_create returns EPERM (the test path we want to validate).
#
# To force SPAWNED mode for the second half of the test, either:
#   (a) uncomment the heap_size line below, rebuild, and re-flash, or
#   (b) declare this app in an init.yaml with restart:no — the supervisor
#       always spawns a real task for init.yaml services.
#
# heap_size: 4096
