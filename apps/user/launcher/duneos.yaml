name: launcher
version: "0.1.0"
required_abi_version: 1
permissions: 352          # INPUT | FS_READ | FS_WRITE
# heap_size > 0 keeps the launcher in spawned mode (its own task + slot) so it
# can loop forever and spawn child apps without occupying the shell's task.
heap_size: 8192
capabilities:
  - display
sources:
  # The translation core and its fd wrapper, listed explicitly rather than
  # pulled by a capability: `capabilities: [input]` already means the producer
  # side (the kb/btn pin defines for the scanning daemons), and listing the
  # sources is what keeps each app paying only for what it uses.
  - $SDK/input/libinput.c
  - $SDK/input/libinput_fd.c
  - $SDK/ui/ui.c
  - $SDK/ui/ui_statusbar.c
  - $SDK/ui/ui_carousel.c
  - $SDK/display/gfx.c
  - $SDK/app/libappmeta.c
  - $SDK/image/libimage.c
  - $SDK/log/dlog.c
