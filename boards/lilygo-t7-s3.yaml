board:
  name: "lilygo-t7-s3"
  cpu: esp32s3
  flash_size_mb: 16
  psram_size_mb: 8
  psram_type: opi   # OPI PSRAM, 80 MHz

  uart:
    - id: 0
      tx_pin: 43
      rx_pin: 44
      default_baud: 115200

  spi:
    - id: 2
      mosi_pin: 11
      miso_pin: 13
      clk_pin: 12
      cs_pin: 10
      role: master
      max_freq_hz: 40000000

  sd_card:
    interface: spi
    spi_id: 2
    cd_pin: -1

  leds:
    - id: status
      pin: 17
      active_high: true
