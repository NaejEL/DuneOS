board:
  name: "lilygo-t-embed-cc1101"
  cpu: esp32s3
  # ESP32-S3-WROOM-1-N16R8: 16MB embedded flash (octal), 8MB OPI PSRAM
  flash_size_mb: 16
  psram_size_mb: 8
  psram_type: opi

  uart:
    - id: 0
      tx_pin: 43
      rx_pin: 44
      default_baud: 115200

  # SPI2: SD card
  # SPI3: ST7789 display (dedicated bus, no MISO needed)
  spi:
    - id: 2
      mosi_pin: 16
      miso_pin: 17
      clk_pin: 14
      cs_pin: 18
      role: master
      max_freq_hz: 20000000

  sd_card:
    interface: spi
    spi_id: 2
    cd_pin: -1

  # I2C0: BQ25896 charger (0x6B) + BQ27220 fuel gauge (0x55)
  i2c:
    - id: 0
      sda_pin: 8
      scl_pin: 9
      freq_hz: 400000

  display:
    driver: st7789
    width: 240
    height: 280
    # Display uses SPI3 with dedicated pins (no MISO)
    spi_host: SPI3_HOST
    mosi_pin: 11
    clk_pin: 12
    cs_pin: 10
    dc_pin: 13
    rst_pin: 1
    bl_pin: 15
    freq_hz: 40000000

  battery:
    # BQ27220 gas gauge on I2C0 — reports voltage/SoC/charge status directly.
    # BQ25896 charger (0x6B) also present but status is read from BQ27220 FLAGS.
    type: bq27220
    i2c_id: 0
    gauge_addr: 0x55
    charger_addr: 0x6B

  leds:
    - id: status
      pin: 48
      type: ws2812
      active_high: true

  # CC1101 sub-GHz radio — userspace app via /dev/spi-1 (Phase 11).
  # Pins for reference: MOSI=41 MISO=38 SCK=40 CS=46 GDO0=2 GDO2=3
  # Rotary encoder — input device via /dev/input/event0 (Phase 12).
  # Pins for reference: A=4 B=5 SW=6 (verify against schematic)
