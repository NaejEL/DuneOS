board:
  name: "esp32c3-devkitc"
  arch: riscv32
  sdk: esp-idf
  cpu: esp32c3
  flash_size_mb: 4
  psram_size_mb: 0

  uart:
    - id: 0
      tx_pin: 21
      rx_pin: 20
      default_baud: 115200

  spi:
    - id: 2
      mosi_pin: 6
      miso_pin: 2
      clk_pin: 4
      cs_pin: 10
      max_freq_hz: 20000000

  sd_card:
    interface: spi
    spi_id: 2
    cd_pin: -1

  leds:
    - id: status
      pin: 8
      active_high: true
