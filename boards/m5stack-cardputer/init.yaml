# DuneOS /init.yaml for m5stack-cardputer
# Edit this file or use 'dbt' TUI (Init Config) to manage boot services.
services:
  - path: /bin/splash.dap
    restart: no
  - path: /bin/usb_shell.dap
    restart: always
    after: splash
  - path: /bin/kb_iomatrix.dap
    restart: always
    after: splash
