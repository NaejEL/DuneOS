board:
  name: "m5stack-cardputer"
  arch: xtensa-esp32s3
  sdk: esp-idf
  cpu: esp32s3
  # ESP32-S3FN8: 8MB embedded flash (octal), NO external PSRAM
  flash_size_mb: 8
  # console: none — disables the ESP-IDF early-boot serial console entirely.
  # This does NOT mean "no log output". DuneOS redirects all ESP_LOG* output to
  # USB CDC at runtime via esp_log_set_vprintf (drv_usb_cdc_attach_log).
  # "none" is the correct choice whenever usb.mode=otg: TinyUSB owns GPIO19/20
  # so USB-JTAG is unavailable, and UART0 (GPIO43/44) must stay free for apps.
  console: none
  psram_size_mb: 0

  uart:
    - id: 0
      tx_pin: 43
      rx_pin: 44
      default_baud: 115200

  # SPI2: SD card only. Display uses a dedicated SPI3 bus (not exposed as raw).
  spi:
    - id: 2
      mosi_pin: 14
      miso_pin: 39
      clk_pin: 40
      cs_pin: 12
      role: master
      max_freq_hz: 20000000

  sd_card:
    interface: spi
    spi_id: 2
    cd_pin: -1

  # Display: ST7789 240×135 on dedicated SPI3 bus.
  # SPI3 is consumed by the display — not exposed as /dev/spi-1.
  display:
    driver: st7789
    width: 240
    height: 135
    spi_host: SPI3_HOST
    mosi_pin: 35
    clk_pin: 36
    cs_pin: 37
    dc_pin: 34
    rst_pin: 33
    bl_pin: 38
    freq_hz: 40000000
    rotation: 1     # 90° CW — panel is portrait; CardPuter uses landscape
    col_offset: 53  # ST7789 CASET offset — 240×320 internal buffer, panel active area starts here
    row_offset: 40  # ST7789 RASET offset

  # Keyboard: IOMatrix — 74HC138 decoder selects one of 8 rows via 3 GPIO
  # outputs; 7 column GPIO inputs with pull-ups detect the pressed key.
  # Physical layout: 4 rows × 14 columns (decoder output 0-3 = left half,
  # output 4-7 = right half; row = output % 4, col = bit*2 + (output>=4)).
  keyboard_matrix:
    type: ioMatrix
    row_select_pins: [8, 9, 11]   # A0, A1, A2 inputs of 74HC138
    col_pins: [13, 15, 3, 4, 5, 6, 7]
    matrix_rows: 4
    matrix_cols: 14

  # Battery: TP4057 charger + ADC voltage divider (VBAT/2 on GPIO10 = ADC1_CH9).
  # CHRG pin of TP4057 is not wired to any GPIO.
  battery:
    type: adc_simple
    adc_unit: ADC_UNIT_1
    adc_channel: 9
    vdiv_factor: 2
    full_mv: 4200
    empty_mv: 3300
    chrg_gpio: -1

  leds:
    - id: status
      pin: 21
      type: ws2812
      active_high: true

  # USB mode — GPIO19/20 are shared between USB-JTAG and USB OTG on ESP32-S3.
  # They are mutually exclusive: choose one mode per build.
  #
  #   mode: jtag   — USB-JTAG/Serial (built-in, no TinyUSB)
  #                  Enables: GDB via OpenOCD, serial console, idf_monitor
  #                  Disables: MSC drag-and-drop, CDC app shell
  #
  #   mode: otg    — USB OTG via TinyUSB (CDC + MSC composite device)
  #                  Enables: /dev/ttyUSB0 (CDC shell), drag-and-drop SD card
  #                  Disables: JTAG, GDB, idf_monitor — use UART0 (GPIO43/44)
  #
  # To switch: change mode: below, then run bspgen + idf.py fullclean + build + flash.
  usb:
    mode: otg
    vid: 0x303A
    pid: 0x4DAE
    msc:
      backend: sd     # expose /sd as a drag-and-drop USB drive
    cdc:
      enabled: true   # virtual serial port (/dev/ttyUSB0)
