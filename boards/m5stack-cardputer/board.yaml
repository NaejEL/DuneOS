board:
  name: "m5stack-cardputer"
  arch: xtensa-esp32s3
  sdk: esp-idf
  cpu: esp32s3
  # ESP32-S3FN8: 8MB embedded flash (octal), NO external PSRAM
  flash_size_mb: 8
  # console: none — disables the ESP-IDF early-boot serial console entirely.
  # This does NOT mean "no log output". DuneOS redirects all ESP_LOG* output to
  # USB CDC at runtime via esp_log_set_vprintf (drv_usb_cdc_attach_log).
  # "none" is the correct choice whenever usb.mode=otg: TinyUSB owns GPIO19/20
  # so USB-JTAG is unavailable, and UART0 (GPIO43/44) must stay free for apps.
  console: none
  psram_size_mb: 0

  # main_task runs the whole boot on this stack: LittleFS mount, SD mount, then
  # duneos_loader_scan over every .dap in /bin — a deep chain
  # (lfs_bd_crc -> lfs_bd_read -> esp_partition_read -> spi_flash_op_lock) on
  # Xtensa, which spills a register window per call frame.
  # Measured 2026-09-05 on this board (one SD card, 35 apps in /bin): with the
  # stack temporarily raised to 12288 B so the measurement could not itself
  # overflow, uxTaskGetStackHighWaterMark(NULL) after service launch reported
  # 8524 B free. NOTE the denominator: ESP-IDF creates main_task with
  # ESP_TASK_MAIN_STACK = CONFIG_ESP_MAIN_TASK_STACK_SIZE + TASK_EXTRA_STACK_SIZE
  # (esp_task.h:57), and TASK_EXTRA_STACK_SIZE is 512 unless
  # CONFIG_LIBC_NEWLIB_NANO_FORMAT is set, which it is not here (picolibc). So
  # the real stack was 12288 + 512 = 12800 B and the peak 12800 - 8524 = 4276 B,
  # against ESP-IDF's 3584 + 512 = 4096 B default.
  # The board was overflowing by 180 B, silently, into the adjacent heap.
  # That measurement was taken with CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK
  # OFF. The same change turns it on project-wide, and ESP-IDF's Kconfig help
  # says the watchpoint's alignment requirement "decreases the usable stack
  # size by up to 60 bytes" per task. So the arithmetic here is on the USABLE
  # stack, not the declared one:
  #   4608 + 512 extra = 5120 real  - 60 watchpoint = 5060 usable
  #   5060 usable                      - 4276 measured =  784 B margin (18%)
  # The 784 B is unchanged from the earlier write-up of this derivation, which
  # used 4548 - 3764: both the declared size and the peak were understated by
  # the same 512 B, so the errors cancelled in the margin and only the
  # denominator was wrong. Quote 5120, not 4608, when budgeting from this.
  # for LittleFS state and SD presence, which move the peak. 4608 is kept: 784 B
  # is over four Xtensa register-window spills (16-64 B each), and the next step
  # up would cost 512 B of DRAM on a board with no PSRAM. The watchpoint is what
  # makes an under-estimate here a named panic rather than heap corruption —
  # though only for an overflow landing in the last 32 B, not one that
  # overshoots the region entirely.
  main_task_stack: 4608

  uart:
    - id: 0
      tx_pin: 43
      rx_pin: 44
      default_baud: 115200

    # UART1 — Grove HY2.0 port, repurposed as the HLK-LD2450 mmWave radar
    # link (PO decision 2026-08-09, Q1/Q2 — specs/SPEC-radar-ld2450.md).
    # Wiring (Grove pin → sensor): G2/GPIO2 = CardPuter TX → LD2450 RX,
    # G1/GPIO1 = CardPuter RX ← LD2450 TX. Exposed as /dev/uart1, never a
    # console candidate. 256000 8N1 is the LD2450 factory baud rate.
    - id: 1
      tx_pin: 2
      rx_pin: 1
      default_baud: 256000

  # Two SPI buses:
  #   id=2 (SPI2_HOST) — SD card, kernel-internal, not user-exposed (role: master)
  #   id=3 (SPI3_HOST) — dedicated to the ST7789 display, exposed as /dev/spi-1
  #                       (first raw bus, indexed from 1) for userspace libst7789.
  spi:
    - id: 2
      mosi_pin: 14
      miso_pin: 39
      clk_pin: 40
      cs_pin: 12
      role: master
      max_freq_hz: 20000000

    - id: 3
      mosi_pin: 35
      clk_pin: 36
      # No MISO line on the display side (write-only SPI). No board-level CS;
      # the display device's CS is owned by libst7789 via ioctl(SPI_SET_CS).
      role: raw
      max_freq_hz: 40000000

  sd_card:
    interface: spi
    spi_id: 2
    cd_pin: -1

  # I2C0 (Grove HY2.0, SDA=GPIO2 / SCL=GPIO1) is DISABLED on this board:
  # the Grove port is reassigned to UART1 for the HLK-LD2450 radar (PO
  # decision 2026-08-09, Q1 — specs/SPEC-radar-ld2450.md). GPIO1/2 cannot
  # serve both roles; while the radar is wired, /dev/i2c-0 does not exist
  # and i2cscope reports a clean "no I2C bus" error instead of scanning.
  # To get I2C back, remove the `uart: id 1` entry above, uncomment this
  # block, and re-run bspgen.
  # i2c:
  #   - id: 0
  #     sda_pin: 2
  #     scl_pin: 1
  #     freq_hz: 400000

  # Display: ST7789 240×135 served by userspace libst7789 over /dev/spi-1.
  # Pins below are the device-specific GPIOs (CS/DC/RST/BL); the SPI bus
  # itself is declared above under spi: id=3.
  display:
    driver: st7789
    width: 240
    height: 135
    spi_id: 3      # references the spi: entry with id=3 → /dev/spi-1
    cs_pin: 37
    dc_pin: 34
    rst_pin: 33
    bl_pin: 38
    freq_hz: 40000000
    rotation: 1     # 90° CW — panel is portrait; CardPuter uses landscape
    col_offset: 53  # ST7789 CASET offset — 240×320 internal buffer, active area starts here
    row_offset: 40  # ST7789 RASET offset

  # Keyboard: IOMatrix — 74HC138 decoder selects one of 8 rows via 3 GPIO
  # outputs; 7 column GPIO inputs with pull-ups detect the pressed key.
  # Physical layout: 4 rows × 14 columns (decoder output 0-3 = left half,
  # output 4-7 = right half; row = output % 4, col = bit*2 + (output>=4)).
  keyboard_matrix:
    type: ioMatrix
    row_select_pins: [8, 9, 11]   # A0, A1, A2 inputs of 74HC138
    col_pins: [13, 15, 3, 4, 5, 6, 7]
    matrix_rows: 4
    matrix_cols: 14

  # Battery: TP4057 charger + ADC voltage divider (VBAT/2 on GPIO10 = ADC1_CH9).
  # CHRG pin of TP4057 is not wired to any GPIO.
  battery:
    type: adc_simple
    adc_unit: 1
    adc_channel: 9
    vdiv_factor: 2
    full_mv: 4200
    empty_mv: 3300
    chrg_gpio: -1

  leds:
    - id: status
      pin: 21
      type: ws2812
      active_high: true

  # USB mode — GPIO19/20 are shared between USB-JTAG and USB OTG on ESP32-S3.
  # They are mutually exclusive: choose one mode per build.
  #
  #   mode: jtag   — USB-JTAG/Serial (built-in, no TinyUSB)
  #                  Enables: GDB via OpenOCD, serial console, idf_monitor
  #                  Disables: MSC drag-and-drop, CDC app shell
  #
  #   mode: otg    — USB OTG via TinyUSB (CDC + MSC composite device)
  #                  Enables: /dev/ttyUSB0 (CDC shell), drag-and-drop SD card
  #                  Disables: JTAG, GDB, idf_monitor — use UART0 (GPIO43/44)
  #
  # To switch: change mode: below, then run bspgen + idf.py fullclean + build + flash.
  usb:
    mode: otg
    vid: 0x303A
    pid: 0x4DAE
    msc:
      backend: sd     # expose /sd as a drag-and-drop USB drive
    cdc:
      enabled: true   # virtual serial port (/dev/ttyUSB0)
