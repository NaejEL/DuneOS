board:
  name: "lilygo-t-embed-cc1101"
  arch: xtensa-esp32s3
  sdk: esp-idf
  cpu: esp32s3
  # ESP32-S3-WROOM-1-N16R8: 16MB embedded flash (octal), 8MB OPI PSRAM
  flash_size_mb: 16
  psram_size_mb: 8
  psram_type: opi
  # Measured on hardware 2026-11-11 (ADR 040 method: raised to 12288 B so the
  # measurement could not itself overflow, three boots). Worst peak 4192 B.
  # ESP-IDF's 3584 B default gives 4096 B real (+512 TASK_EXTRA_STACK_SIZE),
  # so this board was overflowing by 96 B — 156 B counting the 60 B watchpoint
  # reserve — and crash-looping on the stack canary. 5120 B gives 5632 B real
  # and a 1440 B margin. Deliberately wider than the CardPuter's 844 B: this
  # measurement ran with no SD card (mount fails early) and with the ST7789
  # init failing, so the deeper success paths are NOT in the figure. Re-measure
  # with a card inserted and a working display before trimming it.
  main_task_stack: 5120
  # LilyGO BOARD_POWERON: load switch for the peripheral 3V3 rail — SD card,
  # ST7789 and CC1101 all sit behind it. Left low, they draw leakage only: the
  # SD answers CMD0 at 400 kHz then times out on the first 20 MHz data read,
  # and the panel renders noise with correct registers.
  pwr_enable_pin: 15
  console: usb_jtag

  wifi: true

  uart:
    - id: 0
      tx_pin: 43
      rx_pin: 44
      default_baud: 115200

  # SPI2: shared bus for SD card, ST7789 display, and CC1101.
  # cs_pin here is the SD card CS; display and CC1101 have their own CS pins.
  # role: raw exposes this bus as /dev/spi-1; bus is already initialised by
  # the SD card mount so DUNEOS_SPI1_BUS_SHARED is emitted and drv_spi skips
  # spi_bus_initialize().
  spi:
    - id: 2
      mosi_pin: 9
      miso_pin: 10
      clk_pin: 11
      cs_pin: 13
      role: raw
      max_freq_hz: 40000000

  sd_card:
    interface: spi
    spi_id: 2
    cd_pin: -1

  # I2C0: BQ25896 charger (0x6B) + BQ27220 fuel gauge (0x55) + PN532 NFC
  i2c:
    - id: 0
      sda_pin: 8
      scl_pin: 18
      freq_hz: 100000

  display:
    driver: st7789
    # 1.9" 320x170 landscape. rotation 3 = MADCTL 0xA0 (MY|MV) turns the
    # native portrait panel landscape. INVON is unconditional in
    # st7789_hw.c:97 and this panel needs it.
    # 1.9" 320x170 landscape. MADCTL 0xA0 = MY|MV and a 35 px gap on the
    # short axis — the same transform a working esp_lcd setup uses for this
    # panel. NOT SETTLED: text still renders mirrored and the orientation is
    # unverified on hardware — 0xE0 was worse (third of the panel, glitching).
    width: 320
    height: 170
    madctl: 0xA0
    # ST7789 shares SPI2 bus with SD and CC1101
    spi_host: SPI2_HOST
    mosi_pin: 9
    clk_pin: 11
    cs_pin: 41
    dc_pin: 16
    rst_pin: 40
    bl_pin: 21
    freq_hz: 40000000
    # Native-portrait terms, crossed over when MV=1 (st7789_hw.c:146-149):
    # the visible 170 columns are centred in the controller's 240.
    col_offset: 35
    row_offset: 0

  lora:
    type: cc1101
    spi_id: 2
    cs_pin: 12
    gdo0_pin: 3
    gdo2_pin: 38
    sw1_pin: 47
    sw2_pin: 48
    pwr_enable_pin: 15

  battery:
    # BQ27220 gas gauge on I2C0 — reports voltage/SoC/charge status directly.
    # BQ25896 charger (0x6B) also present but status is read from BQ27220 FLAGS.
    type: bq27220
    i2c_id: 0
    gauge_addr: 0x55
    charger_addr: 0x6B

  rfid:
    type: pn532
    i2c_id: 0
    irq_pin: 17
    reset_pin: 45
    addr: 0x24
    pwr_enable_pin: 15

  leds:
    - id: status
      pin: 14
      type: ws2812
      size: 8
      active_high: true

  # Power switch (GPIO15): controls power rail for CC1101 and WS2812 LED.
  # CC1101 sub-GHz radio — userspace app via /dev/spi-1 (Phase 11).
  # PN532 NFC — on I2C0: IRQ=17 RESET=45

  # One field per button: `intent:` is what the button means, and the key code
  # it injects into /dev/input/event0 is derived from it (tools/dbt/input_map.py
  # INTENT_TO_KEY), so the unmigrated raw readers see what they always saw.
  buttons:
    - pin: 0
      active_low: true
      pull_up: true
      intent: VALIDATE   # Knob press (KNOB_BTN)
    - pin: 6
      active_low: true
      pull_up: true
      intent: BACK       # Side key (KEY_BTN)

  encoder:
    a_pin: 4
    b_pin: 5
    axis: primary
    # This encoder's detent is 2 quadrature counts, not the 4 the HAL assumed:
    # with 4, two physical notches were needed per event and the knob felt
    # half-speed. Measured by feel on hardware 2026-11-12; a working firmware
    # for this board divides raw counts by 2 for the same reason.
    counts_per_detent: 2
    # UNIT: DETENTS, not raw PCNT counts. The HAL already divides — hal_encoder.c
    # watches ±DETENT_COUNTS (4) and clears the counter in the callback, so one
    # mechanical notch reaches /dev/input/event0 as a single REL_WHEEL of ±1.
    # Effective ratio is items-per-detent = 1 / counts_per_step, so 1 is
    # one-item-per-notch and raising it makes navigation SLOWER (2 = one item
    # every two notches). Do not raise it "to match a 4-count detent" — that
    # division has already happened.
    counts_per_step: 1

  # Phase 24.7 safe-boot — hold KEY_BTN (side key, GPIO6) at power-on to load
  # /init.yaml.safe (usb_shell only) instead of the normal init.yaml
  # chain. GPIO6 is also wired to a regular button; the recovery check
  # happens before the btn_gpio daemon configures the pin, and is
  # non-destructive (input + pull-up, then daemon reconfigures identically).
  # GPIO0 (KNOB_BTN) is NOT used because it is the ESP32-S3 strap pin —
  # holding it at power-on enters the ROM bootloader.
  recovery_pin:
    pin: 6
    active_low: true
