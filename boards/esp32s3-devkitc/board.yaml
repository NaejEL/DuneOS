board:
  name: "esp32s3-devkitc"
  arch: xtensa-esp32s3
  sdk: esp-idf
  cpu: esp32s3
  flash_size_mb: 8
  psram_size_mb: 8
  psram_type: opi   # OPI PSRAM, 80 MHz

  uart:
    - id: 0
      tx_pin: 43
      rx_pin: 44
      default_baud: 115200

  spi:
    - id: 2
      mosi_pin: 11
      miso_pin: 13
      clk_pin: 12
      cs_pin: 10
      role: master
      max_freq_hz: 40000000
    - id: 3
      mosi_pin: 15
      miso_pin: 16
      clk_pin: 18
      cs_pin: -1   # CS controlled per-transfer via ioctl(SPI_SET_CS, gpio)
      role: raw
      max_freq_hz: 40000000

  sd_card:
    interface: spi
    spi_id: 2
    cd_pin: -1    # card detect not wired on DevKitC

  i2c:
    - id: 0
      sda_pin: 8
      scl_pin: 9
      freq_hz: 400000

  leds:
    - id: status
      pin: 2
      active_high: true
