name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      # submodules: the host suite links third_party/cjson/cJSON.c into
      # test_manifest_depth (LEG-41) at its stock nesting limit, on purpose —
      # the test asserts that what the pre-parse bound rejects is what cJSON
      # would have descended into. Without this the checkout leaves that path
      # empty and make stops before running any test, taking the pytest step
      # below down with it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run host unit tests
        run: make -C tests/host test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The dbt unit tests are the only executable proof of the `dbt qemu`
      # verdict logic (SPEC-leg-27 criteria 5 and 8), which no other job runs.
      #
      # This step must go red rather than report a green nothing: the recorded
      # failure mode is a run that verified 0 tests and said so nowhere
      # (SPEC-leg-38-08). Hence the exit-code triage and the count floor below,
      # and the self-proof step after it.
      - name: Run dbt Python unit tests
        run: |
          python -m pip install --upgrade pip
          # pyyaml: duneos-bspgen.py sys.exit()s at import time without it,
          # which would abort collection rather than fail a test.
          # textual: test_tui_sdkconfig_guard.py imports dbt.tui. A missing
          # import here is not one red test — it is a collection error that
          # aborts the whole run, so every dbt test would go unrun.
          python -m pip install -c tools/constraints.txt pytest pyyaml textual

          # The floor counts tests that RAN, because a bug that mass-skips the
          # suite clears a collected count. It sits a few below the current 384
          # so that adding one xfail or platform skipif — junit reports both as
          # skipped — does not redden CI, while a mass-skip lands far under it.
          # Raise it when tests are added; a drop is the suite shrinking.
          FLOOR=425

          set +e
          python -m pytest -q --junitxml=pytest-report.xml
          status=$?
          set -e

          if [ "$status" -eq 5 ]; then
            echo "::error::pytest collected 0 tests — NO TEST RAN"
            exit 1
          fi
          if [ "$status" -ge 2 ]; then
            echo "::error::pytest exited $status before running the suite (collection error) — NO TEST RAN"
            exit 1
          fi

          read -r collected skipped <<< "$(python -c "import xml.etree.ElementTree as E; s=next(E.parse('pytest-report.xml').getroot().iter('testsuite')); print(s.get('tests'), s.get('skipped'))")"
          ran=$((collected - skipped))
          echo "collected $collected tests, $skipped skipped, $ran ran (floor $FLOOR)"
          if [ "$ran" -lt "$FLOOR" ]; then
            echo "::error::only $ran of $collected tests ran, floor is $FLOOR — the suite shrank or mass-skipped"
            exit 1
          fi
          exit $status

      # The scratch test lives outside the repo on purpose: inside it, the run
      # above would collect it and this step would become the failure it detects.
      - name: Prove the pytest gate can go red
        run: |
          proof="${RUNNER_TEMP:-$(mktemp -d)}/gate_proof"
          mkdir -p "$proof"
          printf 'def test_the_gate_bites():\n    assert False\n' > "$proof/test_gate_proof.py"
          set +e
          python -m pytest -q -p no:cacheprovider "$proof/test_gate_proof.py"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::a deliberately failing test exited 0 — this job reports success without testing anything"
            exit 1
          fi
          echo "a failing test exits $status, so a real failure would fail this job"

  # Time-bounded libFuzzer run on the ELF validation entry point (SPEC-leg-26
  # criteria 7 and 8). Separate job on purpose: `host-tests` must never depend
  # on a libFuzzer-capable toolchain being present.
  #
  # Duration: 120 s per run, plus a 25 s per-input timeout. Long enough to
  # re-derive the known defects from the seeded corpus, short enough not to
  # gate a PR on a fuzzing budget.
  #
  # Crash handling: libFuzzer writes the reproducer under
  # tests/host/fuzz_artifacts/ and exits non-zero. The artifact is uploaded on
  # every run so a crash is reproducible locally with
  # `./fuzz_elf_validate <artifact>`.
  #
  # This step used to carry `continue-on-error: true`. WHY it existed: the
  # loader then had the known out-of-bounds reads documented as expected
  # failures in tests/host/elf_corpus.c (LEG-01/02/03); the fuzzer found them
  # within seconds, so a gating job would have been permanently red for
  # already-planned bugs. SPEC-leg-01 criterion 4 required this run to be
  # crash-free once the hardening landed. It has, and the guards are in place:
  # duneos_elf_validate() bounds e_shstrndx (elf_parse.c:36-39),
  # check_section_table() bounds sh_name (:131-137) and sh_link (:138-145), and
  # duneos_loader_load() re-bounds sh_link at the indexing site (loader.c:1292)
  # and every st_name (:1329). SPEC-leg-34 added the image-extent bound on top.
  # The run is clean, so the flag is gone and this job gates.
  #
  # These line numbers drift with every change to those two files: the function
  # and the field are the anchor, the numbers are a convenience — re-check them
  # whenever elf_parse.c or loader.c moves.
  fuzz-elf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fuzz the ELF validation entry point
        run: |
          make -C tests/host fuzz-run FUZZ_SECONDS=120
          echo "fuzz-run completed" > tests/host/fuzz_ran.marker

      # WHY this step is NOT continue-on-error: without it a runner with no
      # clang, or a clang with no compiler-rt fuzzer runtime, makes the step
      # above swallow the Makefile's actionable error message and the job goes
      # green having fuzzed nothing. Asserting the binary and the marker exist
      # separates "ran clean" from "never built" — a broken fuzz job stays
      # visible rather than hiding behind a crash that already turned the step
      # above red.
      #
      # With the marker absent, a reproducer under tests/host/fuzz_artifacts/
      # is what tells a crash from a run that simply broke after building. Both
      # now fail the job (the fuzz step gates since SPEC-leg-01 landed); this
      # step exists to say which of the two happened.
      - name: Assert the fuzz target actually built and ran
        if: always()
        run: |
          test -x tests/host/fuzz_elf_validate \
            || { echo "::error::fuzz_elf_validate was never built — see the fuzz step log"; exit 1; }
          if [ -f tests/host/fuzz_ran.marker ]; then
            echo "fuzz run completed with no crash"
          elif [ -n "$(ls -A tests/host/fuzz_artifacts 2>/dev/null)" ]; then
            echo "::error::fuzzer found a crash — the fuzz step above already failed the job. Reproducer uploaded in fuzz-elf-artifacts; run './fuzz_elf_validate <artifact>' to reproduce."
          else
            echo "::error::fuzz binary built but the run failed without producing a reproducer — the fuzz run itself broke, see the fuzz step log"
            exit 1
          fi

      - name: Upload fuzzing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-elf-artifacts
          path: tests/host/fuzz_artifacts/
          if-no-files-found: ignore

  kernel-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-kernel-${{ hashFiles('tools/duneos-bspgen.py') }}

      - name: Generate board support files
        run: |
          echo m5stack-cardputer > .duneos_board
          . $IDF_PATH/export.sh
          pip install -c tools/constraints.txt pyyaml
          python tools/duneos-bspgen.py boards/m5stack-cardputer/board.yaml

      # On dev machines the rule is `dbt flash kernel --build-only`, never raw
      # idf.py — but inside the espressif/idf container idf.py directly is
      # acceptable: the container IS the pinned toolchain dbt would discover.
      - name: Build kernel
        run: |
          git config --global --add safe.directory '*'
          . $IDF_PATH/export.sh
          idf.py build

  # Hardware-free boot + loader smoke test (ADR 039 / SPEC-leg-27).
  # One job per board: sdkconfig is board-specific and CMake aborts on an
  # unclean switch, so each board gets its own build dir AND its own sdkconfig
  # (dbt qemu passes -D SDKCONFIG=<build-dir>/sdkconfig).
  #
  # BOTH LEGS GATE. `esp32s3-qemu` exercises the loader's DRAM allocation
  # branch, `esp32s3-qemu-psram` the `#ifdef CONFIG_SPIRAM` one, and a
  # regression in either turns CI red the day it lands. `fail-fast: false` so
  # one red leg still reports the other.
  #
  # The PSRAM leg was diagnostic-only (`continue-on-error`) until SPEC-leg-30:
  # `idf.py qemu` hardcodes `-m 32M` for every ESP32-S3 and ESP-IDF maps
  # whatever it detects, which filled the chip's whole external-memory vaddr
  # window and left the flash mmap of the partition table with nothing.
  # `dbt qemu` now sizes the machine from the board's own `psram_size_mb`.
  qemu-smoke:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        board: [esp32s3-qemu, esp32s3-qemu-psram]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python deps
        run: |
          . $IDF_PATH/export.sh
          pip install -c tools/constraints.txt pyyaml littlefs-python

      # No qemu install step and no PATH surgery on purpose: `dbt qemu`
      # resolves qemu-system-xtensa from the IDF tools tree and installs it
      # itself when absent. That is criterion 1 of SPEC-leg-27, and CI is
      # where it gets exercised from a cold cache.
      - name: Boot ${{ matrix.board }} under QEMU
        run: |
          git config --global --add safe.directory '*'
          echo ${{ matrix.board }} > .duneos_board
          . $IDF_PATH/export.sh
          python tools/duneos-bspgen.py boards/${{ matrix.board }}/board.yaml
          python tools/dbt.py qemu --board ${{ matrix.board }} \
                                   --build-dir build-${{ matrix.board }}

      # LEG-32 criterion 6: neither QEMU board declares `logic:`, so the logic
      # capture device must not be compiled and must not reach the link. The
      # kernel is WHOLE_ARCHIVE, so a source that slips back into SRCS is
      # force-linked rather than dropped — the map is the proof.
      - name: /dev/logic0 is not linked on a board that did not declare it
        run: |
          BUILD=build-${{ matrix.board }}
          if find "$BUILD" -name 'drv_logic.c.obj' -o -name 'hal_logic.c.obj' | grep -q .; then
            echo "::error::logic driver compiled for ${{ matrix.board }}, which declares no logic:"
            exit 1
          fi
          if grep -q 'drv_logic_register' "$BUILD/duneos.map"; then
            echo "::error::drv_logic_register reached the link on ${{ matrix.board }}"
            exit 1
          fi

  apps-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-apps-${{ hashFiles('tools/dbt.py') }}

      # dbt's find_compiler() resolves xtensa-esp32s3-elf-gcc from PATH first;
      # sourcing export.sh is what puts the container's toolchain there, so no
      # .duneos_idf / IDF_PATH plumbing is needed for app builds.
      - name: Build contest profile apps
        run: |
          git config --global --add safe.directory '*'
          echo m5stack-cardputer > .duneos_board
          . $IDF_PATH/export.sh
          pip install -c tools/constraints.txt pyyaml
          python tools/duneos-bspgen.py boards/m5stack-cardputer/board.yaml
          python tools/dbt.py system build --profile cardputer-contest
