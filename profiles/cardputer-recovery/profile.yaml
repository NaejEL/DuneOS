# DuneOS image profile — M5Stack CardPuter recovery image.
#
# Minimal flash payload: just usb_shell. Use when you want the device to
# come up to the CDC console with nothing else running — e.g. after a
# bricking series of crashing daemons.
#   dbt system flash --profile cardputer-recovery

name: cardputer-recovery
board: m5stack-cardputer
description: "CardPuter recovery — usb_shell only, no daemons"

apps_flash:
  - usb_shell

init_flash:
  - { path: /bin/usb_shell.dap, restart: always }

apps_sd: []
init_sd: []
