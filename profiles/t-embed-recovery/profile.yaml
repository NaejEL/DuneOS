# DuneOS image profile — LilyGo T-Embed CC1101 recovery image.
#
# Available outside `--safe` flash: hold KEY_BTN at power-on instead, which
# loads /flash/init.yaml.safe (the same content, automatically staged).
# This profile is for the permanent-fallback case.

name: t-embed-recovery
board: lilygo-t-embed-cc1101
description: "T-Embed recovery — usb_shell only, no daemons"

apps_flash:
  - usb_shell

init_flash:
  - { path: /flash/bin/usb_shell.dap, restart: always }

apps_sd: []
init_sd: []
