# DuneOS image profile — LilyGo T-Embed CC1101 recovery image.
#
# Minimal flash payload: just usb_shell.
#   dbt system flash --profile t-embed-recovery
#
# The other way in is the hold-key path: hold KEY_BTN at power-on, which loads
# /init.yaml.safe (the same content, automatically staged). This profile is for
# the permanent-fallback case.

name: t-embed-recovery
board: lilygo-t-embed-cc1101
description: "T-Embed recovery — usb_shell only, no daemons"

apps_flash:
  - usb_shell

init_flash:
  - { path: /bin/usb_shell.dap, restart: always }

apps_sd: []
init_sd: []
