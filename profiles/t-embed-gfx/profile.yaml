name: t-embed-gfx
board: lilygo-t-embed-cc1101
description: "T-Embed graphical home — the portability probe: same apps as the
  CardPuter contest profile, on a 240x280 portrait panel driven by a rotary
  encoder instead of a 240x135 landscape panel driven by a keyboard."

# No usb_shell: this board declares no `usb:` section, so drv_usb_cdc never
# creates /dev/ttyUSB0 and usb_shell exits 1 on open(). Its console is
# usb_jtag, for which no shell transport exists yet.
#
# No kb_iomatrix: input here is the kernel's quadrature encoder plus btn_gpio
# for the two buttons, both feeding /dev/input/event0.
#
# Launchable apps live in /bin, not /sd/apps: there is no card in this board,
# and the loader scans /bin first.
apps_flash:
- splash
- btn_gpio
- launcher
- logd
- battery_pub
# the probe set. waves is migrated to intents and navigates with the rotary;
# gfx_demo still reads raw key codes and is keyboard-only here.
# snake and tetris are gone on purpose: both need 2-D continuous control, which
# the intent vocabulary does not express and a rotary plus two buttons cannot
# give them. An app that needs a keyboard should stay visible and launchable
# with a warning rather than be dropped from the image — see docs/backlog.md.
- gfx_demo
- waves
# wifi is here for criterion 19: it is the app whose passphrase prompt goes
# through the text-entry entry point, so it is the only way to see the on-screen
# keyboard presented on a board with no physical keys. wifi_daemon ships with it
# but is NOT auto-started (same reason as the CardPuter contest profile: the
# WiFi runtime costs ~40-50 KiB DRAM); the app starts it on demand.
- wifi
- wifi_daemon
# a few coreutils so the image is useful if a shell ever lands
- ls
- cat
- free
- ps
- services
- reboot
- input

init_flash:
- path: /bin/splash.dap
  restart: no
- path: /bin/btn_gpio.dap
  restart: always
- path: /bin/logd.dap
  restart: always
- path: /bin/battery_pub.dap
  restart: always
- path: /bin/launcher.dap
  restart: always
  after: splash

apps_sd: []
init_sd: []
