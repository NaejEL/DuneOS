name: cardputer-default
board: m5stack-cardputer
description: "CardPuter daily-driver \u2014 USB shell, keyboard, basic utilities"
apps_flash:
- battery
- cat
- free
- gpio
- ifconfig
- input
- iw
- klog
- ls
- mkdir
- mv
- ping
- reboot
- restart
- rm
- services
- tail
- kb_iomatrix
- usb_shell
- wifi_daemon
- splash
init_flash:
- path: /flash/bin/kb_iomatrix.dap
  restart: always
- path: /flash/bin/usb_shell.dap
  restart: always
- path: /flash/bin/wifi_daemon.dap
  restart: always
- path: /flash/bin/splash.dap
  restart: 'no'
apps_sd:
- g_shell
- gfx_demo
- tcp_client
- wifi
init_sd:
- path: /sd/apps/g_shell.dap
  restart: always
  after: splash
