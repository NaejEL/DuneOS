name: cardputer-default
board: m5stack-cardputer
description: "CardPuter daily-driver \u2014 USB shell, keyboard, basic utilities"
apps_flash:
- kb_iomatrix
- usb_shell
- wifi_daemon
- hello_world
- test_crash
- test_exit
- test_hardening
init_flash:
- path: /flash/bin/kb_iomatrix.dap
  restart: always
- path: /flash/bin/usb_shell.dap
  restart: always
- path: /flash/bin/wifi_daemon.dap
  restart: always
- path: /flash/bin/test_hardening.dap
  restart: always
apps_sd:
- battery
- cat
- free
- gpio
- ifconfig
- input
- klog
- ls
- mkdir
- mv
- ping
- reboot
- restart
- rm
- services
- tail
- g_shell
- gfx_demo
- tcp_client
- uart_echo
init_sd: []
