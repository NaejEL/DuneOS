dependencies:
  joltwallet/littlefs:
    version: ">=1.21.1"
  espressif/esp_tinyusb:
    version: "^2.0.1~1"
    rules:
      - if: "idf_target in [esp32s2, esp32s3, esp32p4]"
  # RMII Ethernet PHY drivers (hal_phy.c dispatches across all four at runtime).
  # Left unconditional: gating with `rules: if idf_target in [esp32]` excludes
  # them even on esp32 in this component-manager version, breaking the build.
  # They are tiny header-only libs, so the dep-surface cost on other targets is
  # negligible.
  espressif/lan87xx:
    version: "*"
  espressif/ksz80xx:
    version: "*"
  espressif/rtl8201:
    version: "*"
  espressif/ip101:
    version: "*"
